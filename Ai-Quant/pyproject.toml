[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bull-run"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "vectorbt>=0.26.2",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "oandapyV20>=0.7.2",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "loguru>=0.7.2",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "matplotlib>=3.8.0",
    "scipy>=1.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""

[tool.coverage.run]
omit = ["tests/*", "backtest/reports.py"]
